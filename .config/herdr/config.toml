onboarding = false
[theme]
name = "vesper"
auto_switch = false
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[terminal]
default_shell = "fish"
shell_mode = "non_login"
new_cwd = "follow"
kitty_graphics = true

[keys]
prefix = "ctrl+b"

# Pane navigation (prefix + vim keys) + direct ctrl+alt chords
focus_pane_left = ["prefix+h","alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# Tab navigation
next_tab = ["prefix+n", "ctrl+alt+right"]
previous_tab = ["prefix+p", "ctrl+alt+left"]
new_tab = ["prefix+c", "ctrl+alt+c"]
close_tab = "prefix+shift+x"

# Workspace navigation
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"
next_workspace = "ctrl+alt+down"
previous_workspace = "ctrl+alt+up"

# Splits
split_vertical = ["prefix+v", "ctrl+alt+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]

# Pane ops
zoom = ["prefix+z", "ctrl+alt+z"]
close_pane = "prefix+x"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# Agent navigation
next_agent = ["prefix+a", "ctrl+alt+a", "ctrl+shift+down"]
previous_agent = ["prefix+shift+a", "ctrl+alt+shift+a", "ctrl+shift+up"]
focus_agent = "prefix+alt+1..9"

# Session
detach = "prefix+q"
toggle_sidebar = "prefix+b"
help = "prefix+?"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "run lazygit"

[ui]
sidebar_width = 32
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_collapsed_mode = "compact"
mouse_capture = true
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = true
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[ui.toast]
delivery = "system"
delay_seconds = 2

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[ui.sidebar]

[ui.sidebar.agents]
row_gap = 1 # herdr-agent-quota
