- name: Home
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  # hide-desktop-navigation: true
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: monday

        - type: rss
          limit: 20
          collapse-after: 5
          cache: 12h
          feeds:
            - url: https://selfh.st/rss/
              title: selfh.st
            - url: https://rss.app/feeds/SEU_FEED_ID.xml
              title: leandronsp
            - url: https://newsletter.pragmaticengineer.com/feed
              title: The Pramatic Engineer
            - url: https://aleatorio.dev.br/feed.xml
              title: Aleatório Dev
            # - url: https://ciechanow.ski/atom.xml
            # - url: https://www.joshwcomeau.com/rss.xml
            #   title: Josh Comeau
            # - url: https://samwho.dev/rss.xml
            # - url: https://ishadeed.com/feed.xml
            #   title: Ahmad Shadeed

        - type: rss
          title: X / Twitter
          limit: 20
          collapse-after: 5
          cache: 1h
          feeds:
            - url: http://rsshub:1200/twitter/user/SUBSTITUA_PELO_PERFIL
              title: SUBSTITUA_PELO_PERFIL

        - type: twitch-channels
          channels:
            - mch_agg

    - size: full
      widgets:
        - type: group
          widgets:
            - type: hacker-news
            - type: lobsters

        - type: videos
          channels:
            - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
            - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
            - UCsBjURrPoezykLs9EqgamOA # Fireship
            - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
            - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

        - type: group
          widgets:
            - type: reddit
              subreddit: technology
              show-thumbnails: true
            - type: reddit
              subreddit: selfhosted
              show-thumbnails: true
            - type: reddit
              subreddit: opencodecli
              show-thumbnails: true

        - type: custom-api
          title: F1 - Calendário 2026
          cache: 3h
          url: https://api.jolpi.ca/ergast/f1/current/races.json
          template: |
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
              {{ range .JSON.Array "MRData.RaceTable.Races" }}
              {{ $raceDate := .String "date" }}
              {{ $raceTime := .String "time" }}
              {{ $raceDateTime := concat $raceDate "T" $raceTime }}
              {{ $parsedTime := parseLocalTime "2006-01-02T15:04:05" $raceDateTime }}
              <li class="{{ if $parsedTime.After (now) }}color-primary{{ end }}">
                <span class="size-h6 color-subdue">R{{ .String "round" }}</span>
                <span>{{ .String "raceName" }}</span>
                <div class="size-h6">{{ .String "Circuit.circuitName" }}</div>
                <div class="size-h6 color-highlight">{{ $raceDate }}</div>
              </li>
              {{ end }}
            </ul>

        - type: custom-api
          title: F1 - Campeonato de Pilotos
          cache: 3h
          url: https://api.jolpi.ca/ergast/f1/current/driverstandings.json
          template: |
            <ul class="list collapsible-container" data-collapse-after="5">
              {{ range $i, $driver := .JSON.Array "MRData.StandingsTable.StandingsLists.0.DriverStandings" }}
              <li class="flex items-center {{ if eq $i 0 }}color-primary{{ else if eq $i 1 }}color-highlight{{ end }}">
                <div class="grow min-width-0">
                  <span>{{ .String "position" }}. {{ .String "Driver.code" }}</span>
                  <span class="size-h6">({{ .String "Constructors.0.name" }})</span>
                </div>
                <span class="shrink-0 text-right">{{ .String "points" }}</span>
              </li>
              {{ end }}
            </ul>

    - size: small
      widgets:
        - type: weather
          location: Recife, Brazil
          units: metric # alternatively "imperial"
          hour-format: 12h # alternatively "24h"
          # Optionally hide the location from being displayed in the widget
          # hide-location: true

        - type: markets
          markets:
            - symbol: SPY
              name: S&P 500
            - symbol: BTC-USD
              name: Bitcoin
            - symbol: NVDA
              name: NVIDIA
            - symbol: AAPL
              name: Apple
            - symbol: MSFT
              name: Microsoft

        - type: releases
          cache: 1d
          # Without authentication the Github API allows for up to 60 requests per hour. You can create a
          # read-only token from your Github account settings and use it here to increase the limit.
          # token: ...
          repositories:
            - glanceapp/glance
            - go-gitea/gitea
            - immich-app/immich
            - syncthing/syncthing

        - type: custom-api
          title: Latest Community Widgets
          cache: 1d
          url: https://raw.githubusercontent.com/glanceapp/community-widgets/refs/heads/main/registry/widgets.json
          template: |
            <ul class="list list-gap-14 collapsible-container" data-collapse-after="3">
              {{ $widgets := .JSON.Array "" | sortByTime "time_added" "rfc3339" "desc" }}
              {{ if gt (len $widgets) 10 }}
                {{ $widgets = slice $widgets 0 10 }}
              {{ end }}
              {{ range $widgets }}
              <li>
                <a class="size-h4 block text-truncate color-primary-if-not-visited" href="https://github.com/glanceapp/community-widgets/blob/main/widgets/{{ .String "directory" }}/README.md" target="_blank" rel="noreferrer">{{ .String "title" }}</a>
                <p class="text-truncate-2-lines margin-top-3">{{ .String "description" }}</p>
                <ul class="list-horizontal-text margin-top-3">
                  <li {{ .String "time_added" | parseRelativeTime "rfc3339" }}></li>
                  <li>{{ .String "author" }}</li>
                </ul>
              </li>
              {{ end }}
            </ul>
        - type: custom-api
          title: Trending Repositories
          cache: 24h 
          url: 'https://api.ossinsight.io/v1/trends/repos/?period=past_week&language=All'
          template: |
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="3">
              {{ range .JSON.Array "data.rows"}}
                <li>
                  <a class="color-primary-if-not-visited" href="https://github.com/{{ .String "repo_name" }}">{{ .String "repo_name" }}</a> 
                  <ul class="list-horizontal-text">
                      <li class="color-highlight"> {{.String "primary_language"}} </li>

                      <li style="display: flex; align-items: center;gap: 4px;">
                      {{ .Int "stars" }}
                      <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
                      </svg>
                    </li>

                        <li style="display: flex; align-items: center;gap: 4px;">
                          {{ .Int "forks" }}
                          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <circle cx="12" cy="18" r="2" />
                            <circle cx="7" cy="6" r="2" />
                            <circle cx="17" cy="6" r="2" />
                            <path d="M7 8v2a2 2 0 0 0 2 2h6a2 2 0 0 0 2 -2v-2" />
                            <path d="M12 12l0 4" />
                          </svg>
                        </li>

                        <li style="display: flex; align-items: center;gap: 4px;">
                          {{ .Int "pull_requests" }}
                          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <circle cx="6" cy="6" r="3"></circle>
                            <circle cx="18" cy="18" r="3"></circle>
                            <path d="M13 6h3a2 2 0 0 1 2 2v7"></path>
                            <line x1="6" y1="9" x2="6" y2="21"></line>
                          </svg>
                        </li>

                    </ul>
                    <ul class="list collapsible-container">
                      <li style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" class="color-subdue">
                        Contributors: {{ .String "contributor_logins"}}
                      </li>
                      <li>
                        {{ .String "description" }}
                      </li>
                    </ul>
                  </li>
                {{ end }}
              </ul>

        - type: bookmarks
          groups:
            - links:
                - title: Gmail
                  url: https://mail.google.com/mail/u/0/
                - title: Jellyfin
                  url: http://192.168.1.X:8096
                  icon: video
                - title: Tdarr Dashboard
                  url: http://192.168.1.X:8265
                  icon: cpu
                - title: Portainer # Caso use para gerenciar os containers
                  url: http://192.168.1.X:9443
                  icon: container
                - title: YouTube Live Status
                  url: https://youtube.com/c/SEU_CANAL/live
                  icon: youtube

        - type: html
          title: OpenCode Usage
          source: |
            <div style="text-align: center; padding: 16px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 8px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
              </svg>
              <p class="margin-bottom-10">Veja o uso do seu plano OpenCode</p>
              <a href="https://opencode.ai/workspace/SEU_WORKSPACE_ID/go" target="_blank" rel="noreferrer" class="color-primary" style="text-decoration: underline;">Abrir OpenCode →</a>
            </div>

        - type: custom-api
          title: CS2 - BR nas Internacionais
          cache: 30m
          url: https://api.pandascore.co/csgo/matches/upcoming?per_page=30&sort=begin_at
          headers:
            Authorization: Bearer ${PANDASCORE_API_KEY}
          template: |
            {{ $matches := .JSON.Array "" }}
            {{ if eq (len $matches) 0 }}
            <p class="color-subdue">Configure a PandaScore API key no .env e reinicie o container</p>
            {{ else }}
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
              {{ range $matches }}
              {{ $team1 := .String "opponents.0.opponent.name" }}
              {{ $team2 := .String "opponents.1.opponent.name" }}
              {{ $matchStr := concat $team1 " " $team2 }}
              {{ if ne (findMatch "FURIA|paiN|Legacy|Gaimin" $matchStr) "" }}
              <li>
                <div class="flex items-center gap-8">
                  <span class="text-truncate color-primary">{{ $team1 }}</span>
                  <span class="color-highlight size-h6">vs</span>
                  <span class="text-truncate color-primary">{{ $team2 }}</span>
                </div>
                <div class="flex items-center gap-8 margin-top-4">
                  <span class="size-h6 color-subdue text-truncate">{{ .String "tournament.name" }}</span>
                  <span class="size-h6 color-highlight shrink-0" {{ .String "begin_at" | parseRelativeTime "rfc3339" }}></span>
                </div>
              </li>
              {{ end }}
              {{ end }}
            </ul>
            {{ end }}
